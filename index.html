<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NEXO — Tu círculo, tu seguridad</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='20' cy='20' r='12' fill='%238B5CF6'/%3E%3Ccircle cx='44' cy='20' r='12' fill='%23582C83'/%3E%3Ccircle cx='32' cy='40' r='12' fill='%237E57C2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ===================== INICIO DE SESION ===================== -->
  <section id="vistaLogin" class="vista-auth">
    <div class="burbuja bu1"></div>
    <div class="burbuja bu2"></div>
    <div class="burbuja bu3"></div>

    <div class="tarjeta-auth">
      <div class="logo-marca">
        <div class="logo-sello">
          <svg class="logo-nudo" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="20" cy="20" r="12" fill="currentColor"/>
            <circle cx="44" cy="20" r="12" fill="currentColor" opacity="0.8"/>
            <circle cx="32" cy="40" r="12" fill="currentColor"/>
          </svg>
        </div>
        <h1>NEXO</h1>
        <p>Tu círculo, tu seguridad</p>
      </div>

      <form id="formLogin" class="form-auth" novalidate>
        <div class="campo">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 6.5 L12 13 L20.5 6.5"/>
          </svg>
          <input id="loginCorreo" type="email" placeholder="Correo electrónico" autocomplete="email">
        </div>

        <div class="campo">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11 V7 a4 4 0 0 1 8 0 v4"/>
          </svg>
          <input id="loginContrasena" type="password" placeholder="Contraseña" autocomplete="current-password">
        </div>

        <div class="fila-enlace">
          <a href="#" id="linkOlvide">¿Olvidaste tu contraseña?</a>
        </div>
        <p id="loginError" class="error-msg"></p>

        <button type="submit" id="btnLogin" class="btn btn-primario btn-grueso btn-block">Iniciar sesión</button>
      </form>

      <p class="pie-auth">¿No tienes cuenta? <a href="#" id="linkRegistro">Créala aquí</a></p>
    </div>
  </section>

  <!-- ===================== REGISTRO ===================== -->
  <section id="vistaRegistro" class="vista-auth oculta">
    <div class="burbuja bu1"></div>
    <div class="burbuja bu2"></div>
    <div class="burbuja bu3"></div>

    <div class="tarjeta-auth">
      <div class="logo-marca">
        <div class="logo-sello">
          <svg class="logo-nudo" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="20" cy="20" r="12" fill="currentColor"/>
            <circle cx="44" cy="20" r="12" fill="currentColor" opacity="0.8"/>
            <circle cx="32" cy="40" r="12" fill="currentColor"/>
          </svg>
        </div>
        <h1>Crear cuenta</h1>
        <p>Únete a tu primer círculo</p>
      </div>

      <form id="formRegistro" class="form-auth" novalidate>
        <div class="campo">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4.5 20 c1.5-3.5 4.2-5 7.5-5 s6 1.5 7.5 5"/>
          </svg>
          <input id="regNombre" type="text" placeholder="Nombre completo" autocomplete="name">
        </div>
        <div class="campo">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 6.5 L12 13 L20.5 6.5"/>
          </svg>
          <input id="regCorreo" type="email" placeholder="Correo electrónico" autocomplete="email">
        </div>
        <div class="campo">
          <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11 V7 a4 4 0 0 1 8 0 v4"/>
          </svg>
          <input id="regContrasena" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password">
        </div>
        <p id="regError" class="error-msg"></p>

        <button type="submit" id="btnRegistro" class="btn btn-primario btn-grueso btn-block">Crear cuenta</button>
      </form>

      <p class="pie-auth">¿Ya tienes cuenta? <a href="#" id="linkLogin">Inicia sesión</a></p>
    </div>
  </section>

  <!-- ===================== APLICACION ===================== -->
  <div id="app" class="app oculta">

    <header class="cabecera">
      <div class="cabecera-izq">
        <svg class="logo-nudo logo-mini" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="20" cy="20" r="12" fill="#8B5CF6"/>
          <circle cx="44" cy="20" r="12" fill="#582C83"/>
          <circle cx="32" cy="40" r="12" fill="#7E57C2"/>
        </svg>
        <span id="textoCabecera">Mapa</span>
      </div>
      <div class="estado-en-vivo" title="Círculo activo">
        <span class="punto-vivo"></span><span id="textoEnVivo">en vivo</span>
      </div>
    </header>

    <main class="contenido">

      <section id="vistaMapa" class="vista vista-mapa">
        <div id="mapa" class="mapa"></div>
        <div id="bannerPrivacidad" class="banner-privacidad oculta">
          <strong>Tu ubicación está oculta.</strong> Actívala desde tu perfil para que tu círculo pueda verte.
        </div>
        <div class="controles-mapa">
          <button id="btnCentrar" class="btn-control" title="Centrar en mi ubicación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          </button>
          <button id="btnAjustar" class="btn-control" title="Ver todo el círculo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
        </div>
        <button id="btnSos" class="btn-sos">SOS</button>
        <div id="fichaMiembro" class="ficha-miembro oculta"></div>
      </section>

      <section id="vistaGrupo" class="vista oculta">
        <div id="contenidoGrupo"></div>
      </section>

      <section id="vistaLugares" class="vista oculta">
        <div id="contenidoLugares"></div>
      </section>

      <section id="vistaAlertas" class="vista oculta">
        <div id="contenidoAlertas"></div>
      </section>

      <section id="vistaPerfil" class="vista oculta">
        <div id="contenidoPerfil"></div>
      </section>

    </main>

    <nav class="tabs">
      <button data-vista="mapa" class="tab activa">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path d="M9 3v16M15 5v16"/></svg>
        </span>Mapa
      </button>
      <button data-vista="grupo" class="tab">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.9-3.2 3.3-5 6.5-5s5.6 1.8 6.5 5"/><circle cx="17" cy="9" r="2.8"/><path d="M16 15.2c2.6.2 4.5 1.6 5.5 4"/></svg>
        </span>Grupo
      </button>
      <button data-vista="lugares" class="tab">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        </span>Lugares
      </button>
      <button data-vista="alertas" class="tab">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10.3 3.6 4 17a1.4 1.4 0 0 0 1.3 2h13.4a1.4 1.4 0 0 0 1.3-2L13.7 3.6a1.7 1.7 0 0 0-3.4 0z"/><path d="M12 9v4"/><circle cx="12" cy="17" r="0.4" fill="currentColor"/></svg>
        </span>Alertas<span id="badgeAlertas" class="badge oculta"></span>
      </button>
      <button data-vista="perfil" class="tab">
        <span class="icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/></svg>
        </span>Perfil
      </button>
    </nav>
  </div>

  <div id="tapete" class="tapete oculta"></div>
  <div id="modal" class="modal oculta"></div>
  <div id="toast" class="toast oculta"></div>

  <div id="cargando" class="cargando oculta">
    <div class="spinner"></div>
    <p>Conectando con tu círculo…</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
